; Capone Reborn tunables (see Scripts/GameConfig.cs).

[map]

; Chance (0..1) that a B or C block cell becomes a business; the original uses 0.75.
company_chance=0.9
; Middle-class and center blocks always get at least one business.
min_one_company_in_rich_blocks=true

[animation]

; Unit animation speed in frames per second (Godot's default is 5). Kinds: idle_fps, move_fps, attack_fps, killed_fps.
; A unit type can override a kind: <Type>.<kind>_fps, e.g. Thompson.attack_fps=8 (types as in Units/units.json).
; attack_fps=5
; Game minutes a unit keeps its attack picture after an order's hit (1 game hour = 1 real second).
attack_hold_minutes=20

[movement]

; How units find their way: original (the 1997 game's step-by-step walk with detours) or astar (plans the
; cheapest whole path around buildings; not in the original). Same walking rules and speeds either way.
; Text values need quotes: pathfinding="astar".
pathfinding="original"

[ai]

; Computer players cut the power of their main enemy's best block (remake rule; the original's code has none).
; false = off, as in the original's code (computer players then also keep the original bribe shares).
brownouts=true
; Percent of a computer player's profit moved from savings to politician bribes (brownouts cost politician favour).
politician_share=20
; At most one brownout per this many game days per computer player; 0 = never.
brownout_days=7
